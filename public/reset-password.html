<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Reset Password | Net Worth Tennis</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --pink: #d165a4;
            --orange: #ec613e;
            --peach: #e7b4b5;
            --bg-gradient: linear-gradient(135deg, var(--pink) 0%, var(--orange) 50%, var(--peach) 100%);
            --text-white: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.2);
            --font-display: 'Poppins', 'Helvetica Neue', sans-serif;
            --font-body: 'Inter', 'Helvetica Neue', sans-serif;
            --success-green: #22c55e;
            --error-red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Grainy Texture */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.12;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .reset-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }

        .reset-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem;
        }

        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .reset-logo {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 0.5rem;
            text-transform: lowercase;
        }

        .reset-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-white);
            margin-bottom: 0.5rem;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-white);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--text-white);
            background: rgba(255, 255, 255, 0.2);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--text-white);
            border: none;
            border-radius: 50px;
            color: var(--pink);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 1rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--error-red);
            color: #fecaca;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid var(--success-green);
            color: #bbf7d0;
        }

        .help-text {
            margin-top: 1.5rem;
            text-align: center;
        }

        .help-text p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }

        .help-text a {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 600;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-white);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <a href="/" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Net Worth
        </a>

        <div class="reset-card">
            <!-- Step 1: Request reset -->
            <div id="request-step">
                <div class="reset-header">
                    <h1 class="reset-logo">net worth</h1>
                    <p class="reset-subtitle">Reset Your Password</p>
                </div>

                <div id="request-message" class="message"></div>

                <form id="request-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>

                    <button type="submit" class="btn-submit" id="request-submit-btn">
                        Send Reset Link
                    </button>
                </form>

                <div class="help-text">
                    <p><a href="/login">Back to Login</a></p>
                </div>
            </div>

            <!-- Step 2: Reset password (shown if token in URL) -->
            <div id="reset-step" style="display:none;">
                <div class="reset-header">
                    <h1 class="reset-logo">net worth</h1>
                    <p class="reset-subtitle">Set Your New Password</p>
                </div>

                <div id="reset-message" class="message"></div>

                <form id="reset-form">
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" name="new-password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn-submit" id="reset-submit-btn">
                        Set New Password
                    </button>
                </form>

                <div class="help-text">
                    <p><a href="/login">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');

        // If token in URL, show reset form
        if (resetToken) {
            document.getElementById('request-step').style.display = 'none';
            document.getElementById('reset-step').style.display = 'block';
        }

        function showMessage(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `message ${type} show`;
        }

        // Request reset link
        document.getElementById('request-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const submitBtn = document.getElementById('request-submit-btn');

            document.getElementById('request-message').className = 'message';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'request_password_reset',
                        email: email
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('request-message', 'Check your email for a reset link!', 'success');
                } else {
                    showMessage('request-message', data.error || 'Failed to send reset email', 'error');
                }
            } catch (err) {
                showMessage('request-message', 'Connection error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });

        // Reset password
        if (resetToken) {
            document.getElementById('reset-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const submitBtn = document.getElementById('reset-submit-btn');

                if (newPassword !== confirmPassword) {
                    showMessage('reset-message', 'Passwords do not match', 'error');
                    return;
                }

                if (newPassword.length < 6) {
                    showMessage('reset-message', 'Password must be at least 6 characters', 'error');
                    return;
                }

                document.getElementById('reset-message').className = 'message';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Updating...';

                try {
                    const response = await fetch('/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'reset_password',
                            token: resetToken,
                            new_password: newPassword
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        showMessage('reset-message', 'Password reset! You can now log in with your new password.', 'success');
                        document.getElementById('reset-form').style.display = 'none';
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 2000);
                    } else {
                        showMessage('reset-message', data.error || 'Failed to reset password', 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Set New Password';
                    }
                } catch (err) {
                    showMessage('reset-message', 'Connection error. Please try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Set New Password';
                }
            });
        }
    </script>
    <script src="/js/report-issue.js"></script>
</body>
</html>
