<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Admin | NET WORTH Tennis</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #D4AF37;
            --gold-bright: #FFD700;
            --tennis-ball: #CCFF00;
            --terminal-black: #0a0a0a;
            --terminal-dark: #121212;
            --terminal-gray: #1a1a1a;
            --terminal-border: #2a2a2a;
            --power-red: #DC143C;
            --court-green: #228B22;
            --text-primary: #e8e8e8;
            --text-secondary: #888888;
            --text-muted: #555555;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-mono);
            background: var(--terminal-black);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--terminal-border);
            background: var(--terminal-dark);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gold);
            text-decoration: none;
        }

        .admin-badge {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--power-red);
            border: 1px solid var(--power-red);
            padding: 0.25rem 0.5rem;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-nav {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--terminal-border);
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-nav:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Main Layout */
        .main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }

        @media (min-width: 600px) {
            .main { padding: 2rem; }
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            overflow-x: auto;
        }

        .stat-card {
            background: var(--terminal-dark);
            border: 1px solid var(--terminal-border);
            padding: 1rem;
            min-width: 100px;
            flex: 1;
            text-align: center;
        }

        .stat-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gold);
        }

        /* Section */
        .section {
            margin-bottom: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--terminal-border);
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Search */
        .search-box {
            width: 100%;
            max-width: 300px;
            padding: 0.5rem 0.75rem;
            background: var(--terminal-gray);
            border: 1px solid var(--terminal-border);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--gold);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .data-table th {
            text-align: left;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--terminal-border);
            white-space: nowrap;
        }

        .data-table td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--terminal-border);
            vertical-align: middle;
        }

        .data-table tr:hover {
            background: var(--terminal-dark);
        }

        .player-name {
            color: var(--text-primary);
            font-weight: 500;
        }

        .player-email {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.2rem 0.4rem;
            border-radius: 2px;
        }

        .status-active {
            background: rgba(34, 139, 34, 0.2);
            color: var(--court-green);
        }

        .status-paused {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
        }

        .status-inactive {
            background: rgba(220, 20, 60, 0.2);
            color: var(--power-red);
        }

        .status-admin {
            background: rgba(220, 20, 60, 0.2);
            color: var(--power-red);
        }

        /* Action buttons */
        .btn-action {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--terminal-border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            margin-right: 0.25rem;
        }

        .btn-action:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Message */
        .message {
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid;
            font-size: 0.85rem;
        }

        .message.success {
            background: rgba(34, 139, 34, 0.1);
            border-color: var(--court-green);
            color: var(--court-green);
        }

        .message.error {
            background: rgba(220, 20, 60, 0.1);
            border-color: var(--power-red);
            color: var(--power-red);
        }

        .hidden { display: none; }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
            overflow-y: auto;
        }

        .modal {
            background: var(--terminal-dark);
            border: 1px solid var(--terminal-border);
            max-width: 500px;
            width: 100%;
            margin: 2rem auto;
        }

        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--terminal-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
        }

        .modal-body {
            padding: 1rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--terminal-gray);
            border: 1px solid var(--terminal-border);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .btn {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold);
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
        }

        .btn:hover {
            background: var(--gold);
            color: var(--terminal-black);
        }

        .btn-primary {
            background: var(--gold);
            color: var(--terminal-black);
        }

        .btn-danger {
            border-color: var(--power-red);
            color: var(--power-red);
        }

        .btn-danger:hover {
            background: var(--power-red);
            color: white;
        }

        /* Toggle buttons */
        .toggle-group {
            display: flex;
            gap: 0.5rem;
        }

        .toggle-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--terminal-border);
            background: var(--terminal-gray);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .toggle-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
        }

        /* Quick actions row */
        .quick-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--terminal-border);
        }

        .quick-actions .btn {
            margin-top: 0;
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .data-table {
                font-size: 0.75rem;
            }
            .data-table th,
            .data-table td {
                padding: 0.5rem 0.25rem;
            }
            .hide-mobile {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/" class="logo">NET WORTH</a>
            <span class="admin-badge">Admin</span>
        </div>
        <div class="user-menu">
            <a href="/dashboard" class="btn-nav">Dashboard</a>
            <button class="btn-nav" onclick="logout()">Sign Out</button>
        </div>
    </header>

    <main class="main">
        <div id="message" class="message hidden"></div>

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-card">
                <p class="stat-label">Total Players</p>
                <p class="stat-value" id="stat-total">-</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Active</p>
                <p class="stat-value" id="stat-active">-</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Paused</p>
                <p class="stat-value" id="stat-paused">-</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">This Month</p>
                <p class="stat-value" id="stat-pairings">-</p>
            </div>
        </div>

        <!-- Players Section -->
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">All Players</h2>
                <input type="text" class="search-box" id="search-input" placeholder="Search players...">
            </div>

            <div class="table-wrapper">
                <table class="data-table" id="players-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th class="hide-mobile">Skill</th>
                            <th>Status</th>
                            <th>Games</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="players-body">
                        <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Edit Player Modal -->
    <div id="edit-modal" class="modal-backdrop hidden">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Edit Player</h3>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-player-id">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="edit-name">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="edit-email">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="edit-phone" placeholder="(555) 123-4567">
                </div>

                <div class="form-group">
                    <label>Skill Level</label>
                    <select id="edit-skill">
                        <option value="4.5 Advanced+">4.5 Advanced+</option>
                        <option value="4.0 Advanced">4.0 Advanced</option>
                        <option value="3.5+ Intermediate+">3.5+ Intermediate+</option>
                        <option value="3.5 Intermediate">3.5 Intermediate</option>
                        <option value="3.0 Beginner+">3.0 Beginner+</option>
                        <option value="2.5 Beginner">2.5 Beginner</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Availability</label>
                    <div class="toggle-group" id="edit-availability">
                        <button type="button" class="toggle-btn" data-time="morning">Morning</button>
                        <button type="button" class="toggle-btn" data-time="afternoon">Afternoon</button>
                        <button type="button" class="toggle-btn" data-time="evening">Evening</button>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="savePlayer()">Save Changes</button>

                <div class="quick-actions">
                    <button class="btn" id="pause-toggle-btn" onclick="togglePause()">Pause Player</button>
                    <button class="btn btn-danger" id="active-toggle-btn" onclick="toggleActive()">Deactivate</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auth check
        const token = localStorage.getItem('networth_token');
        const player = JSON.parse(localStorage.getItem('networth_player') || '{}');

        if (!token) {
            window.location.href = '/login';
        }

        let allPlayers = [];
        let currentPlayer = null;

        // Load players
        async function loadPlayers() {
            try {
                const response = await fetch('/api/admin?action=players', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (!data.success) {
                    if (response.status === 403) {
                        showMessage('Admin access required. Redirecting...', 'error');
                        setTimeout(() => window.location.href = '/dashboard', 2000);
                        return;
                    }
                    throw new Error(data.error);
                }

                allPlayers = data.players;
                renderPlayers(allPlayers);
                updateStats(allPlayers);

            } catch (err) {
                showMessage(err.message, 'error');
            }
        }

        // Load pairings count
        async function loadPairingsCount() {
            try {
                const response = await fetch('/api/admin?action=pairings', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.success && data.pairings) {
                    document.getElementById('stat-pairings').textContent = data.pairings.length;
                }
            } catch (err) {
                console.error('Failed to load pairings:', err);
            }
        }

        function updateStats(players) {
            const nonAdmin = players.filter(p => !p.is_admin);
            const active = nonAdmin.filter(p => p.is_active && !p.is_paused);
            const paused = nonAdmin.filter(p => p.is_paused);

            document.getElementById('stat-total').textContent = nonAdmin.length;
            document.getElementById('stat-active').textContent = active.length;
            document.getElementById('stat-paused').textContent = paused.length;
        }

        function renderPlayers(players) {
            const tbody = document.getElementById('players-body');

            if (players.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No players found</td></tr>';
                return;
            }

            tbody.innerHTML = players.map(p => {
                let statusBadge = '';
                if (p.is_admin) {
                    statusBadge = '<span class="status-badge status-admin">Admin</span>';
                } else if (!p.is_active) {
                    statusBadge = '<span class="status-badge status-inactive">Inactive</span>';
                } else if (p.is_paused) {
                    statusBadge = '<span class="status-badge status-paused">Paused</span>';
                } else {
                    statusBadge = '<span class="status-badge status-active">Active</span>';
                }

                return `
                    <tr>
                        <td>${p.is_admin ? '-' : '#' + p.rank}</td>
                        <td>
                            <div class="player-name">${escapeHtml(p.name)}</div>
                            <div class="player-email">${escapeHtml(p.email)}</div>
                        </td>
                        <td class="hide-mobile">${p.skill_level || '-'}</td>
                        <td>${statusBadge}</td>
                        <td>${p.total_games || 0}</td>
                        <td>
                            <button class="btn-action" onclick='openEditModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Edit</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Search
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allPlayers.filter(p =>
                p.name.toLowerCase().includes(query) ||
                p.email.toLowerCase().includes(query)
            );
            renderPlayers(filtered);
        });

        // Edit Modal
        function openEditModal(player) {
            currentPlayer = player;
            document.getElementById('edit-player-id').value = player.id;
            document.getElementById('edit-name').value = player.name || '';
            document.getElementById('edit-email').value = player.email || '';
            document.getElementById('edit-phone').value = player.phone || '';
            document.getElementById('edit-skill').value = player.skill_level || '3.5 Intermediate';

            // Set availability toggles
            document.querySelectorAll('#edit-availability .toggle-btn').forEach(btn => {
                const time = btn.dataset.time;
                const key = `available_${time}`;
                btn.classList.toggle('active', player[key] !== false);
            });

            // Toggle availability
            document.querySelectorAll('#edit-availability .toggle-btn').forEach(btn => {
                btn.onclick = () => btn.classList.toggle('active');
            });

            // Update button labels
            document.getElementById('pause-toggle-btn').textContent = player.is_paused ? 'Unpause Player' : 'Pause Player';
            document.getElementById('active-toggle-btn').textContent = player.is_active ? 'Deactivate' : 'Activate';
            document.getElementById('active-toggle-btn').classList.toggle('btn-danger', player.is_active);

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            currentPlayer = null;
        }

        async function savePlayer() {
            const playerId = document.getElementById('edit-player-id').value;
            const availability = {
                morning: document.querySelector('#edit-availability [data-time="morning"]').classList.contains('active'),
                afternoon: document.querySelector('#edit-availability [data-time="afternoon"]').classList.contains('active'),
                evening: document.querySelector('#edit-availability [data-time="evening"]').classList.contains('active'),
            };

            try {
                const response = await fetch('/api/admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        action: 'update',
                        player_id: playerId,
                        name: document.getElementById('edit-name').value,
                        email: document.getElementById('edit-email').value,
                        phone: document.getElementById('edit-phone').value || null,
                        skill_level: document.getElementById('edit-skill').value,
                        availability
                    })
                });

                const data = await response.json();
                if (data.success) {
                    showMessage('Player updated!', 'success');
                    closeEditModal();
                    loadPlayers();
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                showMessage(err.message, 'error');
            }
        }

        async function togglePause() {
            if (!currentPlayer) return;

            const action = currentPlayer.is_paused ? 'unpause' : 'pause';

            try {
                const response = await fetch('/api/admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        action,
                        player_id: currentPlayer.id
                    })
                });

                const data = await response.json();
                if (data.success) {
                    showMessage(`Player ${action}d!`, 'success');
                    closeEditModal();
                    loadPlayers();
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                showMessage(err.message, 'error');
            }
        }

        async function toggleActive() {
            if (!currentPlayer) return;

            const action = currentPlayer.is_active ? 'deactivate' : 'activate';

            try {
                const response = await fetch('/api/admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        action,
                        player_id: currentPlayer.id
                    })
                });

                const data = await response.json();
                if (data.success) {
                    showMessage(`Player ${action}d!`, 'success');
                    closeEditModal();
                    loadPlayers();
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                showMessage(err.message, 'error');
            }
        }

        // Close modal on backdrop click
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-backdrop')) {
                closeEditModal();
            }
        });

        // Utilities
        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = `message ${type}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;');
        }

        function logout() {
            localStorage.removeItem('networth_token');
            localStorage.removeItem('networth_player');
            window.location.href = '/';
        }

        // Initialize
        loadPlayers();
        loadPairingsCount();
    </script>
</body>
</html>
