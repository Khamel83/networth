name: Daily Health Check

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: America/Los_Angeles

jobs:
  comprehensive-test:
    name: Read-only production health check
    runs-on: ubuntu-latest
    steps:
      - name: Check public pages and safe APIs
        shell: bash
        env:
          SITE_URL: https://networthtennis.com
        run: |
          set -euo pipefail
          export TZ=America/Los_Angeles
          errors=0
          check_get() {
            local name="$1"
            local url="$2"
            shift 2
            local status
            status=$(curl -sS -o "/tmp/health-${name}.json" -w "%{http_code}" "$url" "$@" || true)
            echo "$name: HTTP $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$name returned HTTP $status"
              errors=$((errors + 1))
            fi
          }

          check_get homepage "$SITE_URL/"
          check_get login "$SITE_URL/login"
          check_get join "$SITE_URL/join"
          check_get dashboard "$SITE_URL/dashboard"
          check_get rules "$SITE_URL/rules"
          check_get admin "$SITE_URL/admin"
          check_get system "$SITE_URL/api/system"
          # GET /api/email is status-only and never sends.
          check_get email "$SITE_URL/api/email"
          check_get players "$SITE_URL/api/players"

          PERIOD="$(date '+%B %Y')"
          ENCODED_PERIOD=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$PERIOD")
          check_get pairings "$SITE_URL/api/pairings?period=$ENCODED_PERIOD" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

          if ! grep -q 'report-issue.js' /tmp/health-homepage.json; then
            echo "::error::Homepage is missing report-issue.js"
            errors=$((errors + 1))
          fi

          MODE=$(jq -r '.delivery_mode // "disabled"' /tmp/health-email.json)
          echo "delivery_mode=$MODE"
          {
            echo "## Daily read-only health check"
            echo "- Pacific time: $(date --iso-8601=seconds)"
            echo "- Period: $PERIOD"
            echo "- Email API delivery_mode: `$MODE`"
            echo "- No POST, workflow dispatch, provider probe, or email alert was performed."
          } >> "$GITHUB_STEP_SUMMARY"

          if ! jq -e '.players | type == "array"' /tmp/health-players.json >/dev/null; then
            echo "::error::Players API did not return an array"
            errors=$((errors + 1))
          fi
          if jq -e '.players[] | has("email") or has("phone") or has("is_admin")' /tmp/health-players.json >/dev/null; then
            echo "::error::Public players response contains private fields"
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
