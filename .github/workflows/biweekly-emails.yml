# Scheduled automation for Net Worth Tennis.
#
# The workflow is deliberately delivery-gated: it performs a read-only GET
# against /api/email first and exits cleanly for disabled or dry-run delivery.
# No workflow retry creates a new provider idempotency key.

name: Tennis League Emails

on:
  schedule:
    - cron: '0 17 27 * *'
    - cron: '0 17 28-31 * *'
    - cron: '0 17 1 * *'
    - cron: '0 20 1 * *'
    - cron: '0 17 15 * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Which automation action to run'
        required: true
        default: 'generate_pairings'
        type: choice
        options:
          - generate_pairings
          - monthly_availability
          - final_availability
          - mid_month_reminder
          - health_check

permissions:
  contents: read

env:
  TZ: America/Los_Angeles

jobs:
  gate-check:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.select.outputs.action }}
      period: ${{ steps.select.outputs.period }}
    steps:
      - name: Select action in Pacific time
        id: select
        shell: bash
        run: |
          set -euo pipefail
          export TZ=America/Los_Angeles
          PERIOD="$(date '+%B %Y')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.action }}"
          else
            DAY="$(date +%-d)"
            HOUR="$(date +%H | sed 's/^0//')"
            LAST_DAY="$(date -d "$(date +%Y-%m-01) +1 month -1 day" +%-d)"
            if [ "$DAY" = "27" ]; then
              ACTION=monthly_availability
            elif [ "$DAY" = "$LAST_DAY" ]; then
              ACTION=final_availability
            elif [ "$DAY" = "1" ] && [ "$HOUR" -ge 12 ]; then
              ACTION=health_check
            elif [ "$DAY" = "1" ]; then
              ACTION=generate_pairings
            elif [ "$DAY" = "15" ]; then
              ACTION=mid_month_reminder
            else
              ACTION=skip
            fi
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          {
            echo "## Scheduled automation gate"
            echo "- Pacific date: $(date --iso-8601=seconds)"
            echo "- Action: $ACTION"
            echo "- Period: $PERIOD"
          } >> "$GITHUB_STEP_SUMMARY"

  run-automation:
    needs: gate-check
    if: needs.gate-check.outputs.action != 'skip'
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ needs.gate-check.outputs.action }}
      PERIOD: ${{ needs.gate-check.outputs.period }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Read delivery mode without sending
        id: delivery-mode
        shell: bash
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl -sS -o /tmp/email-status.json -w "%{http_code}" "$SITE_URL/api/email")
          MODE=$(jq -r '.delivery_mode // "disabled"' /tmp/email-status.json)
          echo "GET /api/email -> HTTP $HTTP_STATUS, delivery_mode=$MODE"
          {
            echo "## Delivery gate"
            echo "- GET /api/email: HTTP $HTTP_STATUS"
            echo "- delivery_mode: `$MODE`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Unable to establish delivery mode"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" != "live" ]; then
            echo "delivery_disabled=true" >> "$GITHUB_OUTPUT"
            echo "No sender POST will run while delivery_mode=$MODE."
            echo "::notice::delivery_disabled; no email action executed."
          else
            echo "delivery_disabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check pairings health (read-only)
        if: steps.delivery-mode.outputs.delivery_disabled == 'true' && env.ACTION == 'health_check'
        shell: bash
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl -sS -o /tmp/pairings.json -w "%{http_code}" \
            "$SITE_URL/api/pairings?period=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["PERIOD"]))')" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Read-only pairings health: HTTP $HTTP_STATUS: $(cat /tmp/pairings.json)"
          echo "- Pairings health: HTTP $HTTP_STATUS (read-only)" >> "$GITHUB_STEP_SUMMARY"
          [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]

      - name: Execute live automation action
        if: steps.delivery-mode.outputs.delivery_disabled == 'false' && env.ACTION != 'health_check'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ACTION" = "generate_pairings" ]; then
            ENDPOINT="$SITE_URL/api/pairings"
            BODY=$(jq -nc --arg period "$PERIOD" '{period_label:$period}')
          else
            ENDPOINT="$SITE_URL/api/email"
            case "$ACTION" in
              monthly_availability) EMAIL_ACTION=send_availability_check ;;
              final_availability) EMAIL_ACTION=send_final_reminder ;;
              mid_month_reminder) EMAIL_ACTION=send_midmonth_reminders ;;
              *) echo "::error::Unknown action $ACTION"; exit 1 ;;
            esac
            BODY=$(jq -nc --arg action "$EMAIL_ACTION" --arg period "$PERIOD" \
              '{action:$action,period_label:$period}')
          fi

          HTTP_STATUS=$(curl -sS -o /tmp/action.json -w "%{http_code}" \
            -X POST "$ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d "$BODY")
          RESPONSE=$(cat /tmp/action.json)
          OUTCOME=$(jq -r '.outcome // "pre_send_failure"' /tmp/action.json)
          SUMMARY=$(jq -c '.delivery_summary // {}' /tmp/action.json)
          RECONCILIATION=$(jq -r '.reconciliation_required // false' /tmp/action.json)
          echo "HTTP $HTTP_STATUS: $RESPONSE"
          {
            echo "## Automation result"
            echo "- Action: $ACTION"
            echo "- Period: $PERIOD"
            echo "- HTTP status: $HTTP_STATUS"
            echo "- Outcome: `$OUTCOME`"
            echo "- reconciliation_required: `$RECONCILIATION`"
            echo "- delivery_summary: `$SUMMARY`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HTTP_STATUS" = "409" ]; then
            if [ "$ACTION" = "generate_pairings" ]; then
              TARGET_ACTION=generate_pairings
            else
              TARGET_ACTION="$EMAIL_ACTION"
            fi
            RECON=$(curl -sS -X POST "$SITE_URL/api/email" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -d "$(jq -nc --arg period "$PERIOD" --arg target "$TARGET_ACTION" \
                '{action:"reconcile_email_delivery",email_action:$target,period_label:$period}')")
            echo "Protected reconciliation response: $RECON"
            echo "- Protected reconciliation: `$(echo "$RECON" | jq -c '.')`" >> "$GITHUB_STEP_SUMMARY"
            OUTCOME=$(echo "$RECON" | jq -r '.outcome // "pre_send_failure"')
          fi

          case "$OUTCOME" in
            accepted|already_complete)
              exit 0 ;;
            accepted_needs_reconciliation|unknown_needs_reconciliation|manual_review_required|delivery_disabled)
              echo "::warning::Outcome requires reconciliation or manual review: $OUTCOME"
              exit 0 ;;
            *)
              echo "::error::Automation failed before a confirmed provider outcome: $OUTCOME"
              exit 1 ;;
          esac

      - name: Check pairings health live (read-only)
        if: steps.delivery-mode.outputs.delivery_disabled == 'false' && env.ACTION == 'health_check'
        shell: bash
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl -sS -o /tmp/pairings.json -w "%{http_code}" \
            "$SITE_URL/api/pairings?period=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["PERIOD"]))')" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          RESPONSE=$(cat /tmp/pairings.json)
          echo "Read-only pairings health: HTTP $HTTP_STATUS: $RESPONSE"
          echo "- Pairings health: HTTP $HTTP_STATUS (read-only)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            exit 1
          fi
