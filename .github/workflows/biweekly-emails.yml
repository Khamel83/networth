# Tennis League Email Automation
# ================================
# Schedule:
# - 27th of month at 9am PT: Monthly availability reminder
# - Last day of month at 9am PT: Final availability reminder
# - 1st of month at 9am PT: Generate pairings (emails sent automatically)
# - 1st of month at 12pm PT: Health check (self-healing if pairings failed)
# - 15th of month at 9am PT: Mid-month match reminder
#
# Note: Emails are sent via Resend (noreply@networthtennis.com)
# Requires RESEND_API_KEY env var in Vercel

name: Tennis League Emails

on:
  schedule:
    # 27th of month at 9am PT (5pm UTC) - Monthly availability reminder
    - cron: '0 17 27 * *'
    # 28-31 of month at 9am PT (5pm UTC) - Final availability reminder (last day check)
    - cron: '0 17 28-31 * *'
    # 1st of month at 9am PT (5pm UTC) - Generate pairings
    - cron: '0 17 1 * *'
    # 1st of month at 12pm PT (8pm UTC) - Health check / self-healing backup
    - cron: '0 20 1 * *'
    # 15th of month at 9am PT (5pm UTC) - Mid-month match reminder
    - cron: '0 17 15 * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Which email action to run'
        required: true
        default: 'generate_pairings'
        type: choice
        options:
          - generate_pairings
          - monthly_availability
          - final_availability
          - mid_month_reminder
          - health_check

jobs:
  # Gate-check: Skip execution on days 28-30 when not the actual last day
  # This saves GitHub Actions minutes by not running unnecessary workflow jobs
  gate-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if today is last day
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Always allow manual triggers
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            LAST_DAY=$(date -d "$(date +%Y-%m-01) +1 month -1 day" +%-d)
            TODAY=$(date +%-d)
            if [ "$TODAY" = "$LAST_DAY" ] || [ "$TODAY" = "27" ] || [ "$TODAY" = "1" ] || [ "$TODAY" = "15" ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          fi

  determine-action:
    needs: gate-check
    if: needs.gate-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.set-action.outputs.action }}
      is_last_day: ${{ steps.set-action.outputs.is_last_day }}
    steps:
      - name: Determine which action to run
        id: set-action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
            echo "is_last_day=false" >> $GITHUB_OUTPUT
          else
            DAY=$(date +%-d)
            HOUR=$(date +%H | sed 's/^0//')  # Remove leading zero
            MONTH=$(date +%m)
            YEAR=$(date +%Y)

            # Check if today is last day of month
            LAST_DAY=$(date -d "$YEAR-$MONTH-01 +1 month -1 day" +%-d)

            if [ "$DAY" = "27" ]; then
              echo "action=monthly_availability" >> $GITHUB_OUTPUT
              echo "is_last_day=false" >> $GITHUB_OUTPUT
            elif [ "$DAY" = "$LAST_DAY" ]; then
              echo "action=final_availability" >> $GITHUB_OUTPUT
              echo "is_last_day=true" >> $GITHUB_OUTPUT
            elif [ "$DAY" = "1" ]; then
              # On the 1st, check hour to distinguish main run (9am/17UTC) from health check (12pm/20UTC)
              if [ "$HOUR" -ge 19 ]; then
                echo "action=health_check" >> $GITHUB_OUTPUT
                echo "is_last_day=false" >> $GITHUB_OUTPUT
              else
                echo "action=generate_pairings" >> $GITHUB_OUTPUT
                echo "is_last_day=false" >> $GITHUB_OUTPUT
              fi
            elif [ "$DAY" = "15" ]; then
              echo "action=mid_month_reminder" >> $GITHUB_OUTPUT
              echo "is_last_day=false" >> $GITHUB_OUTPUT
            else
              # For days 28-30 that aren't the last day, skip
              echo "action=skip" >> $GITHUB_OUTPUT
              echo "is_last_day=false" >> $GITHUB_OUTPUT
            fi
          fi

  monthly-availability:
    needs: [gate-check, determine-action]
    if: needs.gate-check.outputs.should_run == 'true' && needs.determine-action.outputs.action == 'monthly_availability'
    runs-on: ubuntu-latest
    steps:
      - name: Log action
        run: |
          echo "Running: MONTHLY AVAILABILITY REMINDER (27th)"
          echo "Sending reminder to all players to update their availability for next month"

      - name: Send monthly availability emails
        run: |
          RESPONSE=$(curl -sL --post301 --post302 --post303 \
            -X POST "${{ secrets.SITE_URL }}/api/email" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{"action": "send_availability_check"}')
          echo "Response: $RESPONSE"

          SENT=$(echo "$RESPONSE" | jq -r '.sent // 0')
          echo "::notice::Emails sent: $SENT"

          if [ "$(echo "$RESPONSE" | jq -r '.success')" != "true" ]; then
            echo "::error::API returned failure: $RESPONSE"
            exit 1
          fi

  final-availability:
    needs: [gate-check, determine-action]
    if: needs.gate-check.outputs.should_run == 'true' && needs.determine-action.outputs.action == 'final_availability'
    runs-on: ubuntu-latest
    steps:
      - name: Log action
        run: |
          echo "Running: FINAL AVAILABILITY REMINDER (Last day of month)"
          echo "Sending final reminder to update playing status before pairings are created"

      - name: Send final availability emails
        run: |
          RESPONSE=$(curl -sL --post301 --post302 --post303 \
            -X POST "${{ secrets.SITE_URL }}/api/email" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{"action": "send_final_reminder"}')
          echo "Response: $RESPONSE"

          SENT=$(echo "$RESPONSE" | jq -r '.sent // 0')
          echo "::notice::Emails sent: $SENT"

          if [ "$(echo "$RESPONSE" | jq -r '.success')" != "true" ]; then
            echo "::error::API returned failure: $RESPONSE"
            exit 1
          fi

  generate-pairings:
    needs: [gate-check, determine-action]
    if: needs.gate-check.outputs.should_run == 'true' && needs.determine-action.outputs.action == 'generate_pairings'
    runs-on: ubuntu-latest
    steps:
      - name: Notify admins of failure
        if: failure()
        run: |
          curl -sL -X POST "${{ secrets.SITE_URL }}/api/email" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{
              "action": "send_admin_alert",
              "subject": "🚨 Net Worth: Pairing Generation Failed",
              "message": "Pairing generation failed during scheduled run. Self-healing will attempt recovery at 12pm PT.\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
      - name: Log action
        run: |
          echo "Running: GENERATE PAIRINGS (with retry logic)"
          echo "This will:"
          echo "  1. Generate new pairings for this month"
          echo "  2. Send match assignment emails to all paired players"
          echo "  3. Retry up to 3 times if it fails"

      - name: Generate pairings and send emails (with retry)
        run: |
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = "false" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES..."

            # Wait before retry (exponential backoff: 10s, 30s, 90s)
            if [ $RETRY_COUNT -gt 1 ]; then
              WAIT_TIME=$((10 * (3 ** (RETRY_COUNT - 2))))
              echo "Waiting ${WAIT_TIME}s before retry..."
              sleep $WAIT_TIME
            fi

            RESPONSE=$(curl -sL --post301 --post302 --post303 \
              -X POST "${{ secrets.SITE_URL }}/api/pairings" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -d '{}')
            echo "Response: $RESPONSE"

            API_SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
            PAIRINGS=$(echo "$RESPONSE" | jq -r '.pairings_created // 0')
            EMAILS=$(echo "$RESPONSE" | jq -r '.emails_sent // 0')

            if [ "$API_SUCCESS" = "true" ] && [ "$PAIRINGS" -gt 0 ]; then
              SUCCESS=true
              echo "::notice::SUCCESS! Pairings created: $PAIRINGS, Emails sent: $EMAILS"
            else
              echo "::warning::Attempt $RETRY_COUNT failed. API success: $API_SUCCESS, Pairings: $PAIRINGS"
            fi
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "::error::All retry attempts failed. Health check will run at 12pm PT to recover."
            exit 1
          fi

  mid-month-reminder:
    needs: [gate-check, determine-action]
    if: needs.gate-check.outputs.should_run == 'true' && needs.determine-action.outputs.action == 'mid_month_reminder'
    runs-on: ubuntu-latest
    steps:
      - name: Log action
        run: |
          echo "Running: MID-MONTH MATCH REMINDER (15th)"
          echo "Sending friendly reminder to players who haven't played their match yet"

      - name: Send mid-month reminder emails
        run: |
          RESPONSE=$(curl -sL --post301 --post302 --post303 \
            -X POST "${{ secrets.SITE_URL }}/api/email" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{"action": "send_midmonth_reminders"}')
          echo "Response: $RESPONSE"

          SENT=$(echo "$RESPONSE" | jq -r '.sent // 0')
          echo "::notice::Emails sent: $SENT"

          if [ "$(echo "$RESPONSE" | jq -r '.success')" != "true" ]; then
            echo "::error::API returned failure: $RESPONSE"
            exit 1
          fi

  health-check:
    needs: [gate-check, determine-action]
    if: needs.gate-check.outputs.should_run == 'true' && needs.determine-action.outputs.action == 'health_check'
    runs-on: ubuntu-latest
    steps:
      - name: Notify admins of failure
        if: failure()
        run: |
          curl -sL -X POST "${{ secrets.SITE_URL }}/api/email" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{
              "action": "send_admin_alert",
              "subject": "🚨 Net Worth: Health Check Failed",
              "message": "Self-healing failed to recover pairings. Manual intervention required.\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
      - name: Log action
        run: |
          echo "Running: HEALTH CHECK (self-healing backup)"
          echo "This checks if pairings were created and retries if needed"

      - name: Check pairings and regenerate if missing
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%B)
          PERIOD="$MONTH $YEAR"

          # Check if pairings exist for this month
          CHECK_RESPONSE=$(curl -sL "${{ secrets.SITE_URL }}/api/pairings")
          EXISTING_COUNT=$(echo "$CHECK_RESPONSE" | jq -r '.count // 0')

          echo "::notice::Current pairings for $PERIOD: $EXISTING_COUNT"

          if [ "$EXISTING_COUNT" -eq 0 ]; then
            echo "::warning::No pairings found! Attempting recovery..."

            # Try to generate pairings with retry
            MAX_RETRIES=3
            RETRY_COUNT=0
            SUCCESS=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = "false" ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Recovery attempt $RETRY_COUNT of $MAX_RETRIES..."

              if [ $RETRY_COUNT -gt 1 ]; then
                WAIT_TIME=$((10 * (3 ** (RETRY_COUNT - 2))))
                echo "Waiting ${WAIT_TIME}s before retry..."
                sleep $WAIT_TIME
              fi

              RESPONSE=$(curl -sL --post301 --post302 --post303 \
                -X POST "${{ secrets.SITE_URL }}/api/pairings" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                -d '{}')

              API_SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
              PAIRINGS=$(echo "$RESPONSE" | jq -r '.pairings_created // 0')
              EMAILS=$(echo "$RESPONSE" | jq -r '.emails_sent // 0')

              if [ "$API_SUCCESS" = "true" ] && [ "$PAIRINGS" -gt 0 ]; then
                SUCCESS=true
                echo "::notice::RECOVERY SUCCESSFUL! Pairings created: $PAIRINGS, Emails sent: $EMAILS"
              else
                echo "::warning::Recovery attempt $RETRY_COUNT failed"
              fi
            done

            if [ "$SUCCESS" = "false" ]; then
              echo "::error::Health check failed to recover. Manual intervention required!"
              exit 1
            fi
          else
            echo "::notice::Pairings already exist. No action needed."
          fi
